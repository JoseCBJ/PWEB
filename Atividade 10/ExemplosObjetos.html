        var aluno1 = new Object();
        aluno1.ra = "00001234";
        aluno1.nome = "Pedro";
        alert(`ra=${aluno1.ra} nome =${aluno1.nome}`)

        aluno2["nome"] = "Pedro";
        alert("ra= " + aluno2.ra + " nome= " + aluno2.nome);

        }

        function Aluno(ra, nome) {
            this.ra = ra;
            this.nome = nome;
            this.MostraDados = function () {
                return "ra= " + this.ra + " nome= " + this.nome;
            }
        }

        var aluno4 = new Aluno("123", "João");
        alert(aluno4.MostraDados());
        alert(aluno4.nome);

        function Aluno2() {
            var ra;
            var nome;
            this.setRA = function (value) {
                this.ra = value;
            }
            this.getRa = function () {
                return this.ra;
            }

            this.setNome = function (value) {
                this.nome = value;
            }
            this.getNome = function () {
                return this.nome;
            }
        }

        var aluno6 = new Aluno2();
        aluno6.setNome("Nome2");
        aluno6.setRA("234");
        alert("ra= " + aluno6.getRa + " nome= " + aluno6.getNome);

        function AlunoADS() {
            var numLab;
            this.setNumLab = function (value) {
                this.numLab = value;
            }
            this.getnumLab = function () {
                return this.numLab;
            }
        }
        //herança
        AlunoADS.prototype = new Aluno2();
        var aluno7 = new AlunoADS();
        aluno7.setNome("Nome3");
        aluno7.setRA("123");
        aluno7.setnumLab(5);
        alert(aluno7.getNome() + " " + aluno7.getnumLab());

        class Aluno1 {
            constructor() {
                this._ra;
                this._nome;
            }
            setNome(value) {
                this._nome = value;
            }
            getNome() {
                return this._nome;
            }
            setRA(value) {
                this._ra = ra;
            }
            getRA(value) {
                return this._ra;
            }
        }
        var objAluno = new Aluno1();
        objAluno = new Aluno1()
        objAluno.setNome("Carol");
        objAluno.setRA('123');
        alert(`nome= ${objAluno.getNome()} ra= ${objAluno.getRA()} `);

            constructor() {
                super();
                this._numLab;
            }
            setNumLab(value) {
                this._numLab = value;
            }
            geNumLab() {

            }
        }
        var objAlunoADS = new AlunoADS1();
        objAlunoADS.setNome("Nome5");
        objAlunoADS.setRA("159");
        objAlunoADS.setNumLab(6);
        alert(`nome= ${objAlunoADS} ra= ${objAlunoADS.getRA()} numLab= ${objAlunoADS.getnumLab}`);

        var obj1 = new Object();
        var obj2 = obj1;
        obj1.nome = "Camila";
        alert(obj2.nome);

        class ContaBancaria {
            #cpf; //atributo privado
            constructor(nome, saldoInicial) {
                this.nome = nome;
                this.saldo = saldoInicial;
            }
            setCpf(value) {
                this.cpf = value;
            }
            getCpf() {
                return this.cpf;
            }
            getSaldo() {
                return this.saldo;
            }
            depositar(valor) {
                this.saldo += valor;
                this.#registrarTransacao(valor);
            }
            #registrarTransacao(valor) {
                console.log(`Depósito de R$ ${valor} realizado pelo ${this.nome} e o Saldo R$ ${this.saldo} apa o cpf ${this.getCpf()} ou ${this.#cpf}`);
            }
        }
        const conta = new ContaBancaria("Gustavo", 1000);
        conta.setCpf(123);
        conta.depositar(500);

        const arr = [
            ['codigo', 1]
            ['nome', "João"]
            ['idade', 23]
        ];
        const obj = Object.fromEntries(arr);
        alert(obj);
        alert(obj.nome);
        alert(JSON.stringify(obj));

        };

        const objNovaEmpresa = {

        const motorista = Object.assign({
